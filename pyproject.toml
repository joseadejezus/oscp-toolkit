[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oscp-toolkit"
version = "2.2.0"
description = "Read-only enumeration helpers for OSCP+ prep and exam day"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jose De Jesus", email = "joseadejezus@gmail.com" }]
keywords = ["oscp", "pentest", "enumeration", "nmap", "bloodhound", "active-directory"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# Deliberately empty. Every optional dependency degrades to plain output rather
# than crashing, so a bare install works in a container with no network.
dependencies = []

[project.optional-dependencies]
# What you actually want day to day: nicer tables and hardened XML parsing.
full = ["rich>=13.0", "defusedxml>=0.7", "ldap3>=2.9", "neo4j>=5.0"]
# bh-quickwin is the only tool that cannot work without its driver.
bloodhound = ["neo4j>=5.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/joseadejezus/oscp-toolkit"
Issues = "https://github.com/joseadejezus/oscp-toolkit/issues"

[project.scripts]
nmap-recon = "oscp_toolkit.nmap_recon:main_cli"
http-serve = "oscp_toolkit.http_serve:main_cli"
ad-enum = "oscp_toolkit.ad_enum:main_cli"
hash-triage = "oscp_toolkit.hash_triage:main_cli"
bh-quickwin = "oscp_toolkit.bh_quickwin:main_cli"
ligolo-pivot = "oscp_toolkit.ligolo_pivot:main_cli"
script-logger = "oscp_toolkit.script_logger:main_cli"
mark = "oscp_toolkit.script_logger:main_mark_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/oscp_toolkit"]
# Only ship source. A stray test artifact in the package dir once ended up inside
# the wheel - this makes that impossible rather than relying on remembering.
only-include = ["src/oscp_toolkit"]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.log", "**/*.txt", "**/*.json"]
